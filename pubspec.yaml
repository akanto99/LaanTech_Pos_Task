name: laantech_pos_task
description: "LaanTech POS background upload/download module (Provider + MVVM + Repository)."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  file_picker: ^13.3.3
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^22.3.3
  intl: ^0.20.3
  another_flushbar: ^2.2.4
  connectivity_plus: ^7.1.0
  public_downloads:
    path: packages/public_downloads
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
